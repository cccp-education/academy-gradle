name: Test

# ACADEMY-13 — the published artefact must be proven before it is released.
# The build lives in academy-plugin/ (autonomous build, own wrapper): every
# Gradle invocation runs from that directory, never from the repository root.
# The publication guard is structural: `publish` needs `test` and only runs on
# a `v*` tag, so no version can reach Maven Central without a green build.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs `check`: unit tests, functionalTest, the aggregate
      # cucumberTest and the six dedicated Cucumber runners (installer,
      # opencode, byok, bridge, material, moodle, env) plus validatePlugins.
      - name: Build and Test
        id: build
        run: ./gradlew build
        working-directory: academy-plugin
        continue-on-error: true

      # A red run must be diagnosable from the outside: job logs require admin
      # rights, but check-run annotations are public. One annotation per
      # failing test case, then fail the job.
      - name: Report failing tests
        if: steps.build.outcome == 'failure'
        working-directory: academy-plugin
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            while IFS= read -r test; do
              echo "::error title=${file##*/}::${test}"
              found=1
            done < <(awk '/<testcase /{n=$0; sub(/.*name="/,"",n); sub(/".*/,"",n)} /<failure/{print n}' "$file")
          done < <(grep -rl '<failure' build/test-results 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo "::error title=build::Build failed without a test failure (see the Gradle log)"
          fi
          exit 1

      # Proves the POM is publishable (sources/javadoc, no unresolved platform
      # pin). Signing is skipped on CI (the build guards on CI=true).
      - name: Verify publishToMavenLocal (POM)
        if: steps.build.outcome == 'success'
        run: ./gradlew publishToMavenLocal
        working-directory: academy-plugin
        env:
          # The build skips signing when CI=true. The runner did not expose it
          # to this step (build.gradle.kts reads System.getenv("CI")), so the
          # POM check tried to sign without a key. Set it explicitly.
          CI: "true"

  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Import GPG key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven Central credentials
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          ossrhUsername=${{ secrets.OSSRH_USERNAME }}
          ossrhPassword=${{ secrets.OSSRH_PASSWORD }}
          signing.useGpgCmd=true
          signing.keyId=${{ steps.import-gpg.outputs.keyid }}
          EOF

      - name: Publish to Maven Central
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        working-directory: academy-plugin
        env:
          CI: "true"
          CCCP_PUBLISH: "true"
