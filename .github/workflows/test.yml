name: Test

# ACADEMY-13 — the published artefact must be proven before it is released.
# The build lives in academy-plugin/ (autonomous build, own wrapper): every
# Gradle invocation runs from that directory, never from the repository root.
# The publication guard is structural: `publish` needs `test` and only runs on
# a `v*` tag, so no version can reach Maven Central without a green build.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Publication target'
        required: true
        default: 'plugin-portal'
        type: choice
        options:
          - plugin-portal
          - maven-central
          - both

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # `build` runs `check`: unit tests, functionalTest, the aggregate
      # cucumberTest and the six dedicated Cucumber runners (installer,
      # opencode, byok, bridge, material, moodle, env) plus validatePlugins.
      - name: Build and Test
        id: build
        run: ./gradlew build
        working-directory: academy-plugin
        continue-on-error: true

      # The JUnit XML is the only artefact that carries the assertion message
      # (the job log only names the failing test). Uploading it makes a red run
      # diagnosable from the outside, which is the point of the guard below.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            academy-plugin/build/test-results
            academy-plugin/build/reports/tests
          if-no-files-found: ignore

      # A red run must be diagnosable from the outside: job logs require admin
      # rights, but check-run annotations are public. One annotation per
      # failing test case, then fail the job.
      - name: Report failing tests
        if: steps.build.outcome == 'failure'
        working-directory: academy-plugin
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            while IFS= read -r test; do
              echo "::error title=${file##*/}::${test}"
              found=1
            done < <(awk '/<testcase /{n=$0; sub(/.*name="/,"",n); sub(/".*/,"",n)} /<failure/{print n}' "$file")
          done < <(grep -rl '<failure' build/test-results 2>/dev/null || true)
          if [ "$found" -eq 0 ]; then
            echo "::error title=build::Build failed without a test failure (see the Gradle log)"
          fi
          exit 1

      # Proves the POM is generated and publishable without invoking signing.
      # `com.gradle.plugin-publish` signs automatically as soon as the `signing`
      # plugin is applied, so `publishToMavenLocal` cannot run on a keyless CI
      # job. Generating the POM is the keyless equivalent: it catches an
      # unresolved platform pin or a malformed coordinate.
      - name: Verify POM generation
        if: steps.build.outcome == 'success'
        working-directory: academy-plugin
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew generatePomFileForPluginMavenPublication
          pom=build/publications/pluginMaven/pom-default.xml
          test -f "$pom"
          grep -q "<groupId>education.cccp</groupId>" "$pom"
          grep -q "<artifactId>academy-plugin</artifactId>" "$pom"
          grep -Eq "<version>[0-9]+\.[0-9]+\.[0-9]+</version>" "$pom"
          ! grep -q "SNAPSHOT" "$pom"
          echo "POM OK: $pom"

  publish:
    name: Publish (${{ github.event.inputs.target || 'plugin-portal' }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle Plugin Portal — cccp-education account. It is the default target
      # (the Sonatype Central portal is restricted until 2026-12-01). The key
      # and secret are the cccp-education account credentials, distinct from
      # the local/session GRADLE_PUBLISH_* variables.
      - name: Publish to the Gradle Plugin Portal (cccp-education)
        if: ${{ github.event.inputs.target != 'maven-central' }}
        run: ./gradlew publishPlugins --no-daemon
        working-directory: academy-plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.CCCP_GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.CCCP_GRADLE_PUBLISH_SECRET }}
          CI: "true"

      # Maven Central — only when explicitly selected (maven-central or both).
      - name: Import GPG key
        if: ${{ github.event.inputs.target == 'maven-central' || github.event.inputs.target == 'both' }}
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure Maven Central credentials
        if: ${{ github.event.inputs.target == 'maven-central' || github.event.inputs.target == 'both' }}
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          ossrhUsername=${{ secrets.OSSRH_USERNAME }}
          ossrhPassword=${{ secrets.OSSRH_PASSWORD }}
          signing.useGpgCmd=true
          signing.keyId=${{ steps.import-gpg.outputs.keyid }}
          EOF

      - name: Publish to Maven Central
        if: ${{ github.event.inputs.target == 'maven-central' || github.event.inputs.target == 'both' }}
        run: ./gradlew publishAggregationToCentralPortal --no-daemon
        working-directory: academy-plugin
        env:
          CI: "true"
          CCCP_PUBLISH: "true"
