name: Offline dogfooding

# ACADEMY-14 — proves the academy box starts without pulling or building.
# Dedicated and non-blocking: the bundle weighs several GB and the run takes
# 20-40 min, so it is never on push/PR. `--pull never --no-build` is the proof:
# if an image were missing, Compose would fail instead of fetching it.
#
# The dogfood build resolves the plugin from `../academy-plugin` via
# includeBuild: no publishToMavenLocal (which would trip plugin-publish's
# automatic signing on a keyless runner), always the current commit.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  offline:
    name: Build the bundle and start the box without pull/build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          docker system prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the offline bundle and the installer scaffold
        run: ./gradlew -p dogfood buildOfflineBundle generateLinuxInstaller --no-daemon
        env:
          CI: "true"

      - name: Materialize the installer scaffold
        run: bash dogfood/build/academy/installers/linux/install.sh

      - name: Load the archive and start the box without pull or build
        run: |
          set -euo pipefail
          APP_DIR="$HOME/.academy/academy"
          cp dogfood/build/academy/offline/offline-images.tar \
             dogfood/build/academy/offline/offline-images.json "$APP_DIR"/
          docker load -i "$APP_DIR/offline-images.tar" | tee /tmp/docker-load.log
          cd "$APP_DIR"
          # Keep the workspace container alive for the image check: its CMD is an
          # interactive zsh that exits immediately without a TTY.
          cat > docker-compose.override.yml <<'EOF'
          services:
            workspace:
              command: ["sleep", "infinity"]
          EOF
          # The generated .env deliberately leaves the secrets blank ("provided at
          # runtime"). The dogfood supplies throwaway values through the shell,
          # which Compose interpolates with precedence over .env.
          export POSTGRES_PASSWORD=dogfood
          export MOODLE_PASSWORD=dogfood
          docker compose up --pull never --no-build -d 2>&1 | tee /tmp/compose-up.log
          if grep -Eiq 'Pulling|Building' /tmp/compose-up.log; then
            echo "::error::compose attempted a pull or a build"
            exit 1
          fi
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/login/index.php >/dev/null; then
              echo "Moodle is up"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Moodle did not answer on :8080"
          docker compose logs --tail=200
          exit 1

      - name: Verify the workspace image is the loaded one
        run: |
          set -euo pipefail
          APP_DIR="$HOME/.academy/academy"
          cd "$APP_DIR"
          cid="$(docker compose ps -q workspace)"
          test -n "$cid"
          image="$(docker inspect --format '{{.Config.Image}}' "$cid")"
          echo "workspace image: $image"
          test "$image" = "cccp-education/academy-workspace:latest"
          grep -q "cccp-education/academy-workspace:latest" offline-images.json
          docker compose ps

      - name: Upload manifest and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-dogfood-logs
          path: |
            dogfood/build/academy/offline/offline-images.json
            /tmp/docker-load.log
            /tmp/compose-up.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down
        if: always()
        run: |
          APP_DIR="$HOME/.academy/academy"
          if [ -d "$APP_DIR" ]; then (cd "$APP_DIR" && docker compose down -v) || true; fi
          df -h /
